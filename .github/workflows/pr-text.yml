# The PR text check on each pull request to ai (ticket rules-that-hold 06). The required check is the job `pr-text`.
# It runs the pr-rules gate of the agent hook through ai-check: the same code as the session gate.
# pull_request_target runs this file and ai-check from the BASE branch, so a PR cannot weaken its own check.
# SECURITY: this job never checks out or runs code of the PR. It reads the PR as data only:
#   the title and body through env and a file, and the PR commits as git objects (a diff, the verify run.log files).
name: pr-text

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [ai, ai-fable]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false    # the token never sits in a file that the PR files could point to
      - name: PR body to a file
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: PR files as data
        # A separate folder that holds the PR files for the gate to read. Nothing in it runs.
        run: |
          git fetch -q --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head" \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git worktree add -q --detach "$RUNNER_TEMP/pr-files" "$HEAD_SHA"
      - name: PR text check (ai-check of the base branch)
        run: ai/bin/ai-check pr-rules --pr-body "$RUNNER_TEMP/pr-body.md" --title "$PR_TITLE" --base "$BASE_REF" --dir "$RUNNER_TEMP/pr-files"
