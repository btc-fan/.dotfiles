# The test suite on each pull request to ai (ticket rules-that-hold 04).
# The required check is the job `tests`: a ruleset names one job name, not one name per OS.
# shortcut: the run time is not measured yet, write it here after the first real run.
name: tests

on:
  pull_request:
    branches: [ai, ai-fable]
  push:
    branches: [ai-fable]      # the comparison branch has no pull request: each push runs the suite

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      AI_TESTS_NO_AGENT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tool versions
        run: /usr/bin/python3 --version && python3 --version && git --version && uv --version
      - name: Test suite
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          set -o pipefail
          bash ai/tests/run.sh | tee "$RUNNER_TEMP/tests.log"
      - name: Job summary
        if: always()
        run: grep -h "^left out" "$RUNNER_TEMP/tests.log" >> "$GITHUB_STEP_SUMMARY" || true

  tests-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AI_TESTS_NO_AGENT: "1"
      AI_PROFILE: dev-mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tool versions
        run: /usr/bin/python3 --version && python3 --version && git --version && uv --version
      - name: Test suite
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          set -o pipefail
          bash ai/tests/run.sh | tee "$RUNNER_TEMP/tests.log"
      - name: Job summary
        if: always()
        run: grep -h "^left out" "$RUNNER_TEMP/tests.log" >> "$GITHUB_STEP_SUMMARY" || true

  tests:
    runs-on: ubuntu-latest
    if: always()
    needs: [tests-macos, tests-ubuntu]
    steps:
      - name: Both test jobs passed
        run: test "${{ needs.tests-macos.result }}" = success && test "${{ needs.tests-ubuntu.result }}" = success
