# Routing table: the only source of truth for "which tool, when".
# The router hook reads it on every prompt, before/after tool calls, and at session start.
# Matching is deterministic (regex, globs, project state). No LLM, no network.
# strength: nudge = inject the action as context; gate = block the step until the condition is met;
# stop = a Stop hook block (once per session per rule) when the prompt matched and the skill was not used.
# require_skill: <name> = the rule passes only with a proof in this session: a Skill call, a typed /name or a
# read of that skill's SKILL.md (gate and stop rules; the name must be in skills.must_use).
# scope: global = every project; opt-in = only when the project enabled the tool (ai-adopt --tools <id>).
# The opt-in rows are also the catalog of opt-in tools that ai-adopt offers.
version: 4
# v4 (2026-11-12, owner, after an independent audit): passive context beats nudges. Project knowledge lives in
# the repo AGENTS.md (managed "## Map" and "## Libraries" blocks). Kept: the four gates, the session-start
# status, the post-commit freshness note, the em dash lint, docs-lookup, the "not enabled" suggestions, and the
# opt-in catalog. Removed (logs showed them ignored or unmeasured): kickoff, no-memories, no-graph, graph-first,
# serena-first, graph-update, docs-on-dependency, github, prompting-others, agent-docs, wait-what, toolbox.
# Serena and graphify are opt-in per project. Grounded Docs and the GitHub MCP are dropped (context7, gh).
# Ticket rules-that-hold 11 (2026-11-20, owner D1): 11 reminder rows left the router; each rule has a home in a
# check, a skill or a tool list (docs/tickets/rules-that-hold/CHANGED-GUARDS.md).
# Ticket rules-that-hold 07 (2026-11-20, owner): no-em-dash and ste-sentence left the router; ai-precommit, the
# commit-msg hook and the PR text check run hooklib's text gate on added lines.
# Fields: proof = regex over the session's tool/skill calls for the Stop miss log; once_per = session | agent
# (the main agent and each subagent by its agent_id).
# Ticket rules-that-hold 12 and 13 (2026-11-20, owner D1): feature-grill, tdd, diagnosing-bugs, project-knowledge
# left; ui, seo, blog, serena and graph stay only as catalog entries (trigger: {}, they never fire). The skill
# descriptions and the index lines of ai/agents-md/80-tool-catalog.md hold the triggers; one status line holds the facts.
# Action placeholders the router fills at fire time: {nav_hint}
# {claude_handoff}. Each value is a full phrase; an empty value disappears; an empty action sends nothing.

layers:
  L1_session_start: {inject: 'one status line, the rules with when: session_start, the skill card', reinject_after_compaction: true}
  L2_forced_eval:
    enabled: true
    prefilter: regex   # runs only when a prompt rule or a tie-break trigger matched, never on every prompt
    none_option: true  # the model may answer "none needed"
    timeout_s: 10      # well under the 30 s hook limit; on timeout fall back to L3 only and log it
  L3_regex: {enabled: true}
  L4_gates: {escape_hatch: 'owner only: sudo ai-gate-skip <gate> <minutes max 60> <why>; root-owned /etc/ai/gate-skip; logged to ~/.local/state/ai/gates.log'}
  L7_miss_log: ~/.local/state/ai/misses.jsonl   # Stop hook: rule fired but no matching tool or skill call

rules:
  - id: nav-first
    scope: global
    summary: 'broad search (Grep, rg); with a graph: denied once, and once per graph symbol'
    trigger: {tool_before: 'Grep|Bash|shell|exec_command|local_shell', command: '(^|[;&|(]\s*)(rg|ag|ack|git grep|grep\s+(-\w*[rR]\w*|--recursive)|find\s+\S+\s+(-i?name|-path|-type))\b'}
    action: "{nav_hint}"   # empty when the repo has no graph and Serena is off
    once_per: 'session'
    deny_once_when: graph   # with a graph: the first search is denied once (stale: update it first), and each
                            # later search that names a code symbol of graph.json once per symbol
    proof: 'graphify (query|affected)|find_symbol|find_referencing_symbols|get_symbols_overview|find_declaration|find_implementations'   # ticket 18: initial_instructions and graphify update are not navigation
    strength: nudge

  # ---------- gates ----------
  - id: audit-before-install
    scope: global
    profiles: [server]    # dev-mac: no install audit (owner decision 2026-11-14); ai-render drops the row there
    summary: 'before a package install command'
    trigger: {tool_before: 'Bash', command: '\b(npm (i|install|add)|pnpm add|yarn add|bun add|pip3? install|uv (add|pip install|tool install)|pipx install|cargo (add|install)|brew install|gem install|go install)\b|npx [^ ]+@latest|curl [^|]*\|\s*(ba)?sh'}
    action: "agent-audit this package first. No @latest, no curl-to-shell."
    strength: gate    # passes only when agent-audit logged this package in the last 24 h

  - id: secret-scan
    scope: global
    summary: 'before git commit or push'
    trigger: {tool_before: 'Bash', command: '\bgit (commit|push)\b'}
    action: "Secret scan found a key, token or password. Remove it before commit or push."
    strength: gate    # gate fires only on a hit

  - id: no-sudo
    scope: global
    profiles: [server]    # dev-mac (all 3 machines): off, agents do what the task needs (owner 2026-11-15)
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\b(sudo|doas|pkexec|sudoedit|su|run0)\b'}
    summary: 'any sudo, su, doas, pkexec'
    action: "No sudo for agents: give the owner the exact command. Server box work: the box MCP tools, or outside a sandbox plain proj-agent <subcommand>."
    strength: gate    # blocks at a command position (also inside bash -c, behind env/nice/timeout); quoted text never counts

  - id: no-destroy
    scope: global
    profiles: [server]    # dev-mac: off (owner 2026-11-15: keep only secret-scan and pr-rules)
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\b(rm|git|docker|docker-compose|podman|podman-compose|dropdb|pg_restore|psql|mysql|mariadb|sqlite3|duckdb)\b'}
    summary: 'rm -r of data, home or repo root; force push or delete of main; reset --hard with changes; root clean -x; compose down -v; DROP/TRUNCATE of a protected DB'
    action: "Give the owner the exact command and why. Rebuildable folders (node_modules, .venv, dist, build) are fine."
    strength: gate    # target-based; protected DB names and extra commands per repo in .ai/destructive.txt

  - id: pr-rules
    scope: global
    summary: 'before gh pr create, edit or ready'
    trigger: {tool_before: 'Bash', command: '\bgh pr (create|edit|ready)\b'}
    action: "PR body (pr skill template): Summary with a Mermaid diagram, Evidence (Before, After), Merge Danger (Door: one-way or two-way; Blast Radius), Docs, Changed guards (Ledger on fix PRs), author-sessions block last."
    strength: gate    # blocks without ```mermaid, <!-- author-sessions, the fields Evidence, Door (one-way or two-way), Blast Radius (placeholders refused), a test file in a fix: PR; --fill/--web refused; Docs, Changed guards, Ledger warn only; create, edit and ready: app code in the diff and a verify-<app> skill need a valid .verify/evidence run.log at the PR head SHA (ticket 05)

  - id: merge-approval
    scope: global
    summary: 'before gh pr merge, or a git push to main or master'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\b.*\b(merge|api)\b|\bgit\b.*\bpush\b'}
    action: "Merge only after the ship skill and when the owner's latest message says merge or approve. No push to main or master."
    strength: gate    # the router stores the owner's OK per session (UserPromptSubmit); a later prompt without it clears it

  - id: worktree-first
    scope: global
    summary: 'edit on main or master'
    trigger: {tool_before: 'Edit|Write|MultiEdit|NotebookEdit'}
    action: "git worktree add ../<repo>-<slug> -b <slug> origin/<main>"
    strength: gate    # owner 2026-11-19; gitignored files and repos without .ai/ pass

  - id: ask-first
    scope: global
    summary: 'restart, boot, deploy, kill, delete'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell'}
    action: "Plan, risk, undo. Wait for a typed OK."
    strength: gate    # owner 2026-11-20; every profile (dev-mac too); reads (status, logs, ps, -l, --dry-run) pass

  - id: no-verify
    scope: global
    summary: 'git commit or push with --no-verify (or commit -n)'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgit\b.*(--no-verify|\s-\w*n)'}
    action: "Never skip git hooks: fix what pre-commit reports, then commit again."
    strength: gate

  # ---------- skill gates (require_skill: proof = a Skill call, a typed /name or a read of its SKILL.md) ----------
  - id: writing-for-agents
    scope: global
    summary: 'before an edit of AGENTS.md, CLAUDE.md, CLAUDE.local.md or a SKILL.md'
    trigger: {tool_before: 'Edit|Write|MultiEdit|apply_patch|Bash|shell|exec_command|local_shell', paths: '**/AGENTS.md|**/CLAUDE.md|**/CLAUDE.local.md|**/SKILL.md'}   # shell: the files it writes (> >> tee, sed -i, cp, mv)
    require_skill: writing-for-agents
    action: "Load the writing-for-agents skill first (Skill tool, or read its SKILL.md), then edit."
    strength: gate

  - id: ship
    scope: global
    summary: 'before gh pr ready'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\s+pr\s+ready\b(?!.*--undo)'}
    require_skill: ship
    action: "Run the ship skill first (checks, review, Evidence), then gh pr ready."
    strength: gate

  - id: gh-write
    scope: global
    summary: 'gh write other than the PR commands'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\b'}
    action: "gh reads run freely; other gh writes ask the owner first."
    strength: gate    # ask (Codex: deny); the PR commands keep their own gates (pr-rules, merge-approval, ship)


  # ---------- opt-in per project (catalog for ai-adopt --tools) ----------
  # serena and graph are ON BY DEFAULT (owner 2026-11-12 evening): they fire in every code repo unless
  # .ai/enabled has no-serena / no-graph. scope stays opt-in so the router can switch them off per project.
  - id: serena
    scope: opt-in
    tool: Serena
    trigger: {}   # catalog entry only: the session status line says Serena on or off (ticket rules-that-hold 13)
    summary: 'Serena on (default)'
    action: "Serena is on here (no memories; the Map holds knowledge): get_symbols_overview / find_symbol for definitions, find_referencing_symbols for callers, replace_symbol_body to edit."
    strength: nudge

  - id: graph
    scope: opt-in
    tool: graphify
    trigger: {}   # catalog entry only: the session status line gives the graph state (ticket rules-that-hold 13)
    summary: 'graphify on (default)'
    action: "graphify is on here: graphify query for structure before rg (auto-refresh after commits, merges, checkouts)."
    strength: nudge

  - id: omc
    scope: opt-in
    tool: oh-my-claudecode
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, oh-my-claudecode on here'
    action: "oh-my-claudecode is on here (/oh-my-claudecode:... skills and agents). Keep .omc/ out of commits, except .omc/skills/."
    strength: nudge

  - id: seo
    scope: opt-in
    summary: 'SEO prompt'
    tool: claude-seo
    trigger: {}   # catalog entry only: the plugin skill description holds the trigger (ticket rules-that-hold 12)
    action: "claude-seo first (/seo audit <url>, /seo page <url>). {claude_handoff}"
    strength: nudge

  - id: blog
    scope: opt-in
    summary: 'blog prompt'
    tool: claude-blog
    trigger: {}   # catalog entry only: the plugin skill description holds the trigger (ticket rules-that-hold 12)
    action: "claude-blog first (claude-blog:blog routes). Post file: blog-*. Site: seo-*. {claude_handoff}"
    strength: nudge

  - id: browser
    scope: opt-in
    summary: 'browser prompt (screenshot, click, e2e)'
    tool: Playwright MCP
    trigger: {prompt: '\b(screenshot|open the page|click|e2e|end to end|browser test|playwright)\b'}
    action: "Playwright MCP (headless, isolated on servers)."
    proof: 'tool:mcp__\S*playwright'
    strength: nudge

  - id: ui
    scope: opt-in
    summary: 'UI prompt or UI file'
    tool: ui-ux-pro-max
    trigger: {}   # catalog entry only: the ui-ux-pro-max description and the Map line Design hold the trigger (ticket 12)
    action: "ui-ux-pro-max. Read design-system/<app>/MASTER.md (and page override) first. None: 3 to 5 --design-system variants (?variant=); the owner picks, then --persist. Ask before paid images or npx ...@latest."
    strength: nudge

# ---------- tie-breaks (single source for L0, L2, L3) ----------
# trigger -> winner; losers named so the router never suggests both.
tiebreaks:
  - {trigger: 'one post file, or a post to be written', winner: 'claude-blog:blog-*', loser: 'claude-seo:seo-*', match: '\b(this|the|a|one|new|my|next) (blog )?post\b|\bpost file\b|\b(write|draft|rewrite) (a |the |this )?(blog )?post\b'}
  - {trigger: 'URL, domain, whole site', winner: 'claude-seo:seo-*', loser: 'claude-blog:blog-*', match: 'https?://|\bwww\.|\b(whole|entire|full) (site|website)\b|\bdomain\b'}
  - {trigger: 'new app or project (kickoff)', winner: 'grilling (grill-with-docs where linked; typed: /grill-me)', loser: 'OMC deep-interview (fallback)', match: '\bnew (app|project)\b|\bkick ?off\b'}
  - {trigger: 'deep interview, ambiguity score', winner: 'OMC deep-interview', loser: 'matt grilling', match: '\bdeep interview\b|\bambiguity score\b'}

# ---------- winner gate (the overlap table of ai/skills/skills-guide/SKILL.md section 5, as data) ----------
# PreToolUse on the Skill tool (Codex: a shell read of the skill file): a name in `losers` is denied and the
# message names `use`. A typed /name of the owner never reaches the Skill tool, so it always runs.
# orchestration: skills that call other skills; after one ran in the session, the losers pass too (owner
# 2026-11-16). ask, babysit, fix-ci and cancel are no losers, so they run, but they unlock nothing.
# test_commands.py checks that this table and the skills guide table hold the same rows and losers.
winners:
  orchestration: [autopilot, ralph, team, ultragoal]
  table:
    - {job: 'New feature or kickoff interview', use: 'grill-with-docs', losers: []}
    - {job: 'Plan a well-scoped feature', use: 'to-spec, to-tickets', losers: ['oh-my-claudecode:plan', 'oh-my-claudecode:omc-plan', 'oh-my-claudecode:ralplan', 'oh-my-codex:plan', 'oh-my-codex:ralplan']}
    - {job: 'Plan a huge unclear effort', use: 'wayfinder', losers: []}
    - {job: 'Build tickets', use: 'implement / implement-spec', losers: ['oh-my-claudecode:execute']}
    - {job: 'Build test-first', use: 'tdd', losers: ['oh-my-claudecode:tdd']}
    - {job: 'Research a library or API', use: 'research (context7 first)', losers: ['oh-my-claudecode:research', 'oh-my-codex:best-practice-research']}
    - {job: 'Review a diff', use: 'Matt code-review', losers: ['oh-my-claudecode:review', 'oh-my-claudecode:omc-review', 'oh-my-codex:code-review']}
    - {job: 'Write a PR body', use: 'pr', losers: ['oh-my-claudecode:pr']}
    - {job: 'Prove a feature works', use: 'verify-<app> (create-verification-skill)', losers: []}
    - {job: 'Knowledge', use: 'AGENTS.md Map, GLOSSARY.md, docs/adr, docs/specs, docs/tickets, docs/research', losers: ['oh-my-claudecode:wiki', 'oh-my-codex:wiki']}
    - {job: 'Pre-merge checks', use: 'ship (ours)', losers: []}
    - {job: 'Cut a version', use: 'release (ours)', losers: ['oh-my-claudecode:release']}

# ---------- skill card (SessionStart: startup, resume, clear, compact; under 1500 characters) ----------
# must_use: the skills a gate checks, one trigger line each. hints: skills the prompt hint names (no block). typed_only: skills with
# disable-model-invocation (no Skill tool call); the card gives the SKILL.md path to read and follow.
skills:
  must_use:
    - {name: writing-for-agents, when: 'before an edit of AGENTS.md, CLAUDE.md, CLAUDE.local.md or a SKILL.md'}
    - {name: ship, when: 'the branch is done, before gh pr ready'}
  hints:      # ticket 14: the prompt hint names them; no block
    - {name: diagnosing-bugs, when: 'a bug, crash, slow or performance prompt'}
    - {name: tdd, when: 'a tests-first or red-green prompt'}
  typed_only: [grill-with-docs, to-spec, to-tickets, implement, handoff, wayfinder, improve-codebase-architecture,
               retro]
