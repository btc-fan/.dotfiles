# Routing table: the only source of truth for "which tool, when".
# The router hook reads it on every prompt, before/after tool calls, and at session start.
# Matching is deterministic (regex, globs, project state). No LLM, no network.
# strength: nudge = inject the action as context; gate = block the step until the condition is met;
# stop = a Stop hook block (once per session per rule) when the prompt matched and the skill was not used.
# require_skill: <name> = the rule passes only with a proof in this session: a Skill call, a typed /name or a
# read of that skill's SKILL.md (gate and stop rules; the name must be in skills.must_use).
# scope: global = every project; opt-in = only when the project enabled the tool (ai-adopt --tools <id>).
# The opt-in rows are also the catalog of opt-in tools that ai-adopt offers.
version: 4
# v4 (2026-11-12, owner, after an independent audit): passive context beats nudges. Project knowledge lives in
# the repo AGENTS.md (managed "## Map" and "## Libraries" blocks). Kept: the four gates, the session-start
# status, the post-commit freshness note, the em dash lint, docs-lookup, the "not enabled" suggestions, and the
# opt-in catalog. Removed (logs showed them ignored or unmeasured): kickoff, no-memories, no-graph, graph-first,
# serena-first, graph-update, docs-on-dependency, github, prompting-others, agent-docs, wait-what, toolbox.
# Serena and graphify are opt-in per project. Grounded Docs and the GitHub MCP are dropped (context7, gh).
# Fields: proof = regex over the session's tool/skill calls for the Stop miss log; once_per = session |
# library_per_session; prompt_libs = also fire when the prompt names a library from the Libraries block.
# Action placeholders the router fills at fire time: {knowledge_index} {knowledge_delta} {libs_hits}
# {claude_handoff}. Each value is a full phrase; an empty value disappears; an empty action sends nothing.

layers:
  L1_session_start: {inject: 'rules with when: session_start; L0 table only after compact or clear', reinject_after_compaction: true}
  L2_forced_eval:
    enabled: true
    prefilter: regex   # runs only when a prompt rule or a tie-break trigger matched, never on every prompt
    none_option: true  # the model may answer "none needed"
    timeout_s: 10      # well under the 30 s hook limit; on timeout fall back to L3 only and log it
  L3_regex: {enabled: true}
  L4_gates: {escape_hatch: 'owner only: sudo ai-gate-skip <gate> <minutes max 60> <why>; root-owned /etc/ai/gate-skip; logged to ~/.local/state/ai/gates.log'}
  L7_miss_log: ~/.local/state/ai/misses.jsonl   # Stop hook: rule fired but no matching tool or skill call

rules:
  # ---------- session start: read the stored knowledge first ----------
  - id: project-knowledge
    scope: global
    trigger: {state: 'git repo with code'}
    when: session_start
    summary: 'session start in a code repo'
    action: "Read the Map and Libraries sections of this repo's AGENTS.md first, then search narrowly. {knowledge_index}"
    strength: nudge   # {knowledge_index}: one status line (Map, Libraries, opt-in tools), never file content

  - id: no-ai-base
    scope: global
    summary: 'session start: repo without .ai/base-version'
    trigger: {state: 'git repo without .ai/base-version'}
    when: session_start
    action: "No AI base or Map here. Suggest the owner runs ai-adopt."
    proof: 'ai-adopt'
    strength: nudge

  - id: merge-review
    scope: global
    trigger: {state: 'git repo with code'}
    when: session_start
    summary: 'session start: main moved since the last architecture review'
    action: "{merge_review}"   # .ai/last-review holds main at the last review; empty when unchanged or not adopted
    proof: 'improve-codebase-architecture|retro|last-review'
    strength: nudge

  - id: legacy-memory
    scope: global
    trigger: {state: 'git repo with code'}
    when: session_start
    summary: 'session start: old Claude memory files for this repo'
    action: "{legacy_memory}"   # ~/.claude/projects/<repo key>/memory; auto memory is off since 2026-11-16
    proof: 'docs/agents/notes.md|Project rules'
    strength: nudge

  - id: upgrade-review
    scope: global
    trigger: {state: 'any session'}
    when: session_start
    summary: 'session start: AI tools changed version since the last review'
    action: "{upgrade_pending}"   # from ~/.local/state/ai/upgrades.json (ai-versions --record in install.sh)
    proof: 'upgrade-review'
    strength: nudge

  - id: nav-first
    scope: global
    summary: 'first broad code search (Grep, rg, grep -r, find); denied once in a code repo with a fresh graph'
    trigger: {tool_before: 'Grep|Bash|shell|exec_command|local_shell', command: '(^|[;&|(]\s*)(rg|ag|ack|git grep|grep\s+(-\w*[rR]\w*|--recursive)|find\s+\S+\s+(-i?name|-path|-type))\b'}
    action: "{nav_hint}"   # empty when the repo has no graph and Serena is off
    once_per: 'session'
    proof: 'graphify|serena|find_symbol|find_referencing_symbols'
    strength: nudge

  - id: knowledge-check
    scope: global
    trigger: {tool_after: 'Bash', command: '\bgit commit\b'}
    summary: 'after a git commit'
    action: "{knowledge_delta}"   # full phrase from HEAD: update the Map, ai-libs --sync (graph: the router refreshes it); empty = silent
    once_per: 'session'
    proof: 'AGENTS.md|ai-libs|graphify update'
    strength: nudge

  # ---------- gates ----------
  - id: audit-before-install
    scope: global
    profiles: [server]    # dev-mac: no install audit (owner decision 2026-11-14); ai-render drops the row there
    summary: 'before a package install command'
    trigger: {tool_before: 'Bash', command: '\b(npm (i|install|add)|pnpm add|yarn add|bun add|pip3? install|uv (add|pip install|tool install)|pipx install|cargo (add|install)|brew install|gem install|go install)\b|npx [^ ]+@latest|curl [^|]*\|\s*(ba)?sh'}
    action: "agent-audit this package first. No @latest, no curl-to-shell."
    strength: gate    # passes only when agent-audit logged this package in the last 24 h

  - id: secret-scan
    scope: global
    summary: 'before git commit or push'
    trigger: {tool_before: 'Bash', command: '\bgit (commit|push)\b'}
    action: "Secret scan found a key, token or password. Remove it before commit or push."
    strength: gate    # gate fires only on a hit

  - id: no-sudo
    scope: global
    profiles: [server]    # dev-mac (all 3 machines): off, agents do what the task needs (owner 2026-11-15)
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\b(sudo|doas|pkexec|sudoedit|su|run0)\b'}
    summary: 'any sudo, su, doas, pkexec'
    action: "No sudo for agents: give the owner the exact command. Box work on a server: the box tool (MCP server box); outside a sandbox also plain proj-agent <subcommand>; never sudo."
    strength: gate    # blocks at a command position (also inside bash -c, behind env/nice/timeout); quoted text never counts

  - id: no-destroy
    scope: global
    profiles: [server]    # dev-mac: off (owner 2026-11-15: keep only secret-scan and pr-rules)
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\b(rm|git|docker|docker-compose|podman|podman-compose|dropdb|pg_restore|psql|mysql|mariadb|sqlite3|duckdb)\b'}
    summary: 'rm -r of data, home or repo root; force push or delete of main; reset --hard with changes; clean -x at the root; compose down -v; DROP/TRUNCATE on a protected DB'
    action: "Destructive command: give the owner the exact command and the reason. Rebuildable folders (node_modules, .venv, dist, build) are fine."
    strength: gate    # target-based; protected DB names and extra commands per repo in .ai/destructive.txt

  - id: pr-rules
    scope: global
    summary: 'before gh pr create or edit'
    trigger: {tool_before: 'Bash', command: '\bgh pr (create|edit)\b'}
    action: "PR body (pr skill template): Summary with a Mermaid diagram, Evidence (Before and After), Merge Danger (Door: one-way or two-way; Blast Radius), Docs, Changed guards (Ledger on fix PRs), author-sessions block at the end."
    strength: gate    # blocks without ```mermaid, <!-- author-sessions, the fields Evidence, Door (one-way or two-way), Blast Radius (placeholders refused), a test file in a fix: PR; --fill/--web refused

  - id: merge-approval
    scope: global
    summary: 'before gh pr merge, or a git push to main or master'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\b.*\b(merge|api)\b|\bgit\b.*\bpush\b'}
    action: "Merge only after the owner's latest message says merge or approve (after the ship skill). No push to main or master."
    strength: gate    # the router stores the owner's OK per session (UserPromptSubmit); a later prompt without it clears it

  - id: no-verify
    scope: global
    summary: 'git commit or push with --no-verify (or commit -n)'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgit\b.*(--no-verify|\s-\w*n)'}
    action: "Never skip the git hooks: fix what the pre-commit check reports, then commit again."
    strength: gate

  # ---------- skill gates (require_skill: proof = a Skill call, a typed /name or a read of its SKILL.md) ----------
  - id: writing-for-agents
    scope: global
    summary: 'before an edit of AGENTS.md, CLAUDE.md, CLAUDE.local.md or a SKILL.md'
    trigger: {tool_before: 'Edit|Write|MultiEdit|apply_patch', paths: '**/AGENTS.md|**/CLAUDE.md|**/CLAUDE.local.md|**/SKILL.md'}
    require_skill: writing-for-agents
    action: "Agent docs: load the writing-for-agents skill first (Skill tool, or read its SKILL.md), then edit."
    strength: gate

  - id: diagnosing-bugs
    scope: global
    summary: 'bug or performance prompt (slow, perf, broken, debug, crash, regression; RO, RU)'
    trigger: {prompt: '\b(slow(er|ly|ness|s|ed|ing)?|performance|perf|broken|debug(s|ged|ging)?|crash(es|ed|ing)?|regressions?)\b|\b(lent[aăe]?|performan[tț][aăe]|stricat[aăe]?|s-a stricat|nu (mai )?merge|depaneaz[aă]|crap[aă]|se blocheaz[aă]|regresie)\b|(?<!\w)(медленн|тормоз|производительн|слома|отлад|дебаг|пада|упал|краш|регресси)\w*|(?<!\w)не работает'}
    require_skill: diagnosing-bugs
    action: "Bug or performance work: use the diagnosing-bugs skill (Skill tool) and follow its loop before you end the turn."
    strength: stop

  - id: ship
    scope: global
    summary: 'before gh pr ready'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\s+pr\s+ready\b(?!.*--undo)'}
    require_skill: ship
    action: "Run the ship skill first (checks, review, Evidence), then gh pr ready."
    strength: gate

  - id: gh-write
    scope: global
    summary: 'gh write other than the PR commands'
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\bgh\b'}
    action: "gh reads run freely; other gh writes ask the owner first."
    strength: gate    # ask (Codex: deny); the PR commands keep their own gates (pr-rules, merge-approval, ship)

  - id: ledger-nudge
    scope: global
    summary: 'before an edit in a regression-ledger area'
    trigger: {tool_before: 'Edit|Write|MultiEdit|NotebookEdit'}
    action: "{ledger_hits}"   # empty outside ledger areas; once per area per session
    strength: nudge

  # ---------- lint and docs ----------
  - id: no-em-dash
    scope: global
    summary: 'after a write with U+2014'
    trigger: {tool_after: 'Edit|Write', content: "\u2014"}   # escaped so this file itself passes the lint
    action: "Remove the em dash (U+2014). Use '-', ':' or a new sentence."
    strength: nudge

  - id: docs-lookup
    scope: global
    summary: 'prompt names a library (Libraries section, deps, known libs), or before a dependency-file edit'
    # Only a named library or a dependency change: the old "docs|sdk|library" words fired on every docs task
    # and were ignored 72 of 88 times (owner 2026-11-16).
    trigger: {prompt_libs: true, tool_before: 'Edit|Write|MultiEdit', paths: 'package.json|pyproject.toml|requirements*.txt|go.mod|Cargo.toml|Gemfile|composer.json'}
    action: "Library code: context7 query-docs with the ID from the Libraries section (resolve only if missing), then the official docs site. {libs_hits}"
    proof: 'tool:mcp__\S*context7'
    strength: nudge

  - id: feature-grill
    scope: global
    summary: 'feature request prompt (add, implement, build ... a feature, endpoint, page; RO, RU)'
    trigger: {prompt: '\b(add|implement|introduce|create)\b(?!\W+(a\W+|an\W+|the\W+|more\W+|some\W+)?(unit\W+|e2e\W+|regression\W+)?tests?\b)(\W+\w+){0,4}?\W+(feature|endpoint|page(?!\W+break)|screen|command|option|flag|setting|integration|flow|button|form|report|export|webhook|notification|mode|login|sign[- ]?in|sign[- ]?up|oauth|auth\w*|rate limit\w*|limiting|caching|pagination|search|upload|download|sync|dashboard|api)s?\b|\bbuild\b(\W+\w+){0,3}?\W+(feature|endpoint|screen|integration|dashboard)s?\b|\badd support for\b|\bnew feature\b|\bfeature request\b|\bchange (how|the way)\b|\bchange the behaviou?r\b|\b(adaug[aă]|implementeaz[aă]|construie[sș]te|creeaz[aă])\b(?!\W+(un\W+)?test)(\W+\w+){0,4}?\W+(func[tț]ionalitate|func[tț]ie|pagin[aă]|endpoint|op[tț]iune|buton|ecran|raport|integrare|comand[aă]|export|import|autentificare|c[aă]utare)\b|\bfunc[tț]ionalitate nou[aă]\b|\bschimb[aă] (cum|felul)\b|(?<!\w)(добавь|добавить|реализуй|реализовать|сделай|создай|внедри)(?!\s+(\w+\s+)?тест)(\W+\w+){0,4}?\W+(функци|фич|эндпоинт|страниц|кнопк|команд|опци|интеграци|отч[её]т|экран|режим|экспорт|импорт|поиск|авторизаци|вход|регистраци|загрузк)\w*|(?<!\w)нов(ую|ая|ой|ые) (функци|фич)\w*|(?<!\w)измени,? как'}
    action: "{feature_flow}"   # grill-with-docs, to-spec, to-tickets, Done order where linked; else plain grilling
    proof: 'skill:\S*grill|grill[\w-]*/SKILL\.md'
    strength: nudge   # strict regex: a verb plus a feature noun; "new app" stays with the kickoff tie-break

  - id: verify-before-done
    scope: global
    summary: 'after a code edit in a project with a verify-<app> skill'
    trigger: {tool_after: 'Edit|Write|MultiEdit|NotebookEdit'}
    action: "{verify_hint}"   # empty without a verify skill or for a non-code file
    once_per: 'session'
    proof: 'verify-[\w-]+'
    strength: nudge

  # ---------- opt-in tool is off here: suggest it, never install it ----------
  - id: seo-not-enabled
    scope: global
    summary: 'SEO prompt, project without claude-seo'
    trigger: {prompt: '\b(seo|serp|rank(ing|s)?|meta (title|description)|schema markup|structured data|sitemap|core web vitals|cwv|hreflang|backlinks?|ai overviews?|geo audit|search console)\b', state: 'project without claude-seo'}
    action: "claude-seo is off in this project. Suggest: ai-adopt --tools seo. Do not enable it yourself."
    proof: 'ai-adopt'
    strength: nudge

  - id: blog-not-enabled
    scope: global
    summary: 'blog prompt, project without claude-blog'
    trigger: {prompt: '\b(blog|blog post|article|write a post|rewrite (the|this) post|newsletter)\b', state: 'project without claude-blog'}
    action: "claude-blog is off in this project. Suggest: ai-adopt --tools blog. Do not enable it yourself."
    proof: 'ai-adopt'
    strength: nudge

  - id: browser-not-enabled
    scope: global
    summary: 'browser prompt, project without Playwright MCP'
    trigger: {prompt: '\b(screenshot|open the page|click|e2e|end to end|browser test|playwright)\b', state: 'project without Playwright MCP'}
    action: "No Playwright MCP in this project. Suggest: ai-adopt --tools browser. Do not install a browser tool yourself."
    proof: 'ai-start'
    strength: nudge

  # ---------- opt-in per project (catalog for ai-adopt --tools) ----------
  # serena and graph are ON BY DEFAULT (owner 2026-11-12 evening): they fire in every code repo unless
  # .ai/enabled has no-serena / no-graph. scope stays opt-in so the router can switch them off per project.
  - id: serena
    scope: opt-in
    tool: Serena
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, Serena on (default)'
    action: "Serena is on here (no memories, the Map is the knowledge place): get_symbols_overview / find_symbol for definitions, find_referencing_symbols for users, replace_symbol_body for edits."
    strength: nudge

  - id: graph
    scope: opt-in
    tool: graphify
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, graphify on (default)'
    action: "graphify is on here: graphify query for structure before rg; the graph refreshes itself after commits, merges and checkouts."
    strength: nudge

  - id: omc
    scope: opt-in
    tool: oh-my-claudecode
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, oh-my-claudecode on here'
    action: "oh-my-claudecode is on here: its skills and agents are available (/oh-my-claudecode:...). It writes .omc/ in this repo (keep it out of commits except .omc/skills/)."
    strength: nudge

  - id: seo
    scope: opt-in
    summary: 'SEO prompt'
    tool: claude-seo
    trigger: {prompt: '\b(seo|serp|rank(ing|s)?|meta (title|description)|schema markup|structured data|sitemap|core web vitals|cwv|hreflang|backlinks?|ai overviews?|geo audit|search console)\b'}
    action: "SEO task: claude-seo first (/seo audit <url>, /seo page <url>). {claude_handoff}"
    proof: 'skill:\S*seo|claude -p|claude-seo/skills'
    strength: nudge

  - id: blog
    scope: opt-in
    summary: 'blog prompt'
    tool: claude-blog
    trigger: {prompt: '\b(blog|blog post|article|write a post|rewrite (the|this) post|newsletter)\b'}
    action: "Blog task: claude-blog first (claude-blog:blog routes). Post file: blog-*. Site: seo-*. {claude_handoff}"
    proof: 'skill:\S*blog|claude -p|claude-blog/skills'
    strength: nudge

  - id: browser
    scope: opt-in
    summary: 'browser prompt (screenshot, click, e2e)'
    tool: Playwright MCP
    trigger: {prompt: '\b(screenshot|open the page|click|e2e|end to end|browser test|playwright)\b'}
    action: "Browser work: Playwright MCP (headless, isolated on servers)."
    proof: 'tool:mcp__\S*playwright'
    strength: nudge

  - id: ui
    scope: opt-in
    summary: 'UI prompt or UI file'
    tool: ui-ux-pro-max
    trigger: {prompt: '\b(ui|ux|design|landing page|component|layout|color palette|typography|dark mode)\b', paths: '**/*.{tsx,jsx,vue,svelte,css,scss}'}
    action: "UI work: use ui-ux-pro-max. Read design-system/<app>/MASTER.md (and the page override) first. No MASTER.md yet: make 3 to 5 directions (--design-system, different styles) as prototype variants (?variant=), the owner picks one, then --persist. Ask before paid image generation or any npx ...@latest."
    proof: 'skill:\S*ui-ux-pro-max'
    strength: nudge

  - id: tracker-flow
    scope: opt-in
    summary: 'tickets, spec, triage, backlog prompt'
    tool: mattpocock tracker skills
    trigger: {prompt: '\b(ticket|tickets|spec|triage|backlog|roadmap|wayfinder)\b'}
    action: "to-spec, then to-tickets (on when the project's skills line lists them). Tickets go to docs/tickets/<feature>/ (docs/agents/issue-tracker.md); never GitHub issues or labels without the owner.{tracker_flow}"
    proof: 'skill:\S*(to-spec|to-tickets)|(to-spec|to-tickets)/SKILL\.md'
    strength: nudge

  - id: domain-docs
    scope: opt-in
    summary: 'glossary, domain model, ADR prompt'
    tool: mattpocock grill-with-docs + domain-modeling
    trigger: {prompt: '\b(glossary|domain model|ubiquitous language|adr|decision record)\b'}
    action: "Use grill-with-docs / domain-modeling (GLOSSARY.md, docs/adr/).{domain_docs}"
    proof: 'skill:\S*(grill-with-docs|domain-model)|(grill-with-docs|domain-modeling)/SKILL\.md'
    strength: nudge

# ---------- tie-breaks (single source for L0, L2, L3) ----------
# trigger -> winner; losers named so the router never suggests both.
tiebreaks:
  - {trigger: 'one post file, or a post to be written', winner: 'claude-blog:blog-*', loser: 'claude-seo:seo-*', match: '\b(this|the|a|one|new|my|next) (blog )?post\b|\bpost file\b|\b(write|draft|rewrite) (a |the |this )?(blog )?post\b'}
  - {trigger: 'URL, domain, whole site', winner: 'claude-seo:seo-*', loser: 'claude-blog:blog-*', match: 'https?://|\bwww\.|\b(whole|entire|full) (site|website)\b|\bdomain\b'}
  - {trigger: 'new app or project (kickoff)', winner: 'grilling (grill-with-docs where the project links it; typed: /grill-me)', loser: 'OMC deep-interview (fallback)', match: '\bnew (app|project)\b|\bkick ?off\b'}
  - {trigger: 'deep interview, ambiguity score', winner: 'OMC deep-interview', loser: 'matt grilling', match: '\bdeep interview\b|\bambiguity score\b'}
  - {trigger: 'library API docs', winner: 'context7 with the Libraries ID', loser: 'web search', match: '\b(api docs|library docs|docs for)\b'}

# ---------- winner gate (the overlap table of ai/skills/skills-guide/SKILL.md section 5, as data) ----------
# PreToolUse on the Skill tool: a call of a name in `losers` is denied and the message names `use`. A typed
# /name of the owner never reaches the Skill tool, so it always runs. OMC and OMX win orchestration: these
# skills always pass, and after one of them ran in the session, the skills it calls pass too.
# test_commands.py checks that this table and the skills guide table hold the same rows and losers.
winners:
  orchestration: [autopilot, ralph, team, ultragoal, ask, babysit, fix-ci, cancel]
  table:
    - {job: 'New feature or kickoff interview', use: 'grill-with-docs', losers: []}
    - {job: 'Plan a well-scoped feature', use: 'to-spec, to-tickets', losers: ['oh-my-claudecode:plan', 'oh-my-claudecode:omc-plan', 'oh-my-claudecode:ralplan']}
    - {job: 'Plan a huge unclear effort', use: 'wayfinder', losers: []}
    - {job: 'Build tickets', use: 'implement / implement-spec', losers: ['oh-my-claudecode:execute']}
    - {job: 'Build test-first', use: 'tdd', losers: ['oh-my-claudecode:tdd']}
    - {job: 'Research a library or API', use: 'research (context7 first)', losers: ['oh-my-claudecode:research']}
    - {job: 'Review a diff', use: 'Matt code-review', losers: ['oh-my-claudecode:review', 'oh-my-claudecode:omc-review']}
    - {job: 'Write a PR body', use: 'pr', losers: ['oh-my-claudecode:pr']}
    - {job: 'Prove a feature works', use: 'verify-<app> (create-verification-skill)', losers: []}
    - {job: 'Knowledge', use: 'AGENTS.md Map, GLOSSARY.md, docs/adr, docs/specs, docs/tickets, docs/research', losers: ['oh-my-claudecode:wiki']}
    - {job: 'Pre-merge checks', use: 'ship (ours)', losers: []}
    - {job: 'Cut a version', use: 'release (ours)', losers: ['oh-my-claudecode:release']}

# ---------- skill card (SessionStart: startup, resume, clear, compact; under 1500 characters) ----------
# must_use: the skills the agent must use, one trigger line each. typed_only: skills with
# disable-model-invocation (no Skill tool call); the card gives the SKILL.md path to read and follow.
skills:
  must_use:
    - {name: writing-for-agents, when: 'before an edit of AGENTS.md, CLAUDE.md, CLAUDE.local.md or a SKILL.md'}
    - {name: diagnosing-bugs, when: 'a bug, crash, slow or performance prompt, before the turn ends'}
    - {name: ship, when: 'the branch is done, before gh pr ready'}
  typed_only: [grill-with-docs, to-spec, to-tickets, implement, handoff, wayfinder, improve-codebase-architecture,
               retro, create-verification-skill, maintain-verification-skill]
