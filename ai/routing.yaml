# Routing table: the only source of truth for "which tool, when".
# The router hook reads it on every prompt, before/after tool calls, and at session start.
# Matching is deterministic (regex, globs, project state). No LLM, no network.
# strength: nudge = inject the action as context; gate = block the step until the condition is met.
# scope: global = every project; opt-in = only when the project enabled the tool (ai-adopt --tools <id>).
# The opt-in rows are also the catalog of opt-in tools that ai-adopt offers.
version: 4
# v4 (2026-11-12, owner, after an independent audit): passive context beats nudges. Project knowledge lives in
# the repo AGENTS.md (managed "## Map" and "## Libraries" blocks). Kept: the four gates, the session-start
# status, the post-commit freshness note, the em dash lint, docs-lookup, the "not enabled" suggestions, and the
# opt-in catalog. Removed (logs showed them ignored or unmeasured): kickoff, no-memories, no-graph, graph-first,
# serena-first, graph-update, docs-on-dependency, github, prompting-others, agent-docs, wait-what, toolbox.
# Serena and graphify are opt-in per project. Grounded Docs and the GitHub MCP are dropped (context7, gh).
# Fields: proof = regex over the session's tool/skill calls for the Stop miss log; once_per = session |
# library_per_session; prompt_libs = also fire when the prompt names a library from the Libraries block.
# Action placeholders the router fills at fire time: {knowledge_index} {knowledge_delta} {libs_hits}
# {claude_handoff}. Each value is a full phrase; an empty value disappears; an empty action sends nothing.

layers:
  L1_session_start: {inject: 'rules with when: session_start; L0 table only after compact or clear', reinject_after_compaction: true}
  L2_forced_eval:
    enabled: true
    prefilter: regex   # runs only when a prompt rule or a tie-break trigger matched, never on every prompt
    none_option: true  # the model may answer "none needed"
    timeout_s: 10      # well under the 30 s hook limit; on timeout fall back to L3 only and log it
  L3_regex: {enabled: true}
  L4_gates: {escape_hatch: 'owner only: sudo ai-gate-skip <gate> <minutes max 60> <why>; root-owned /etc/ai/gate-skip; logged to ~/.local/state/ai/gates.log'}
  L7_miss_log: ~/.local/state/ai/misses.jsonl   # Stop hook: rule fired but no matching tool or skill call

rules:
  # ---------- session start: read the stored knowledge first ----------
  - id: project-knowledge
    scope: global
    trigger: {state: 'git repo with code'}
    when: session_start
    summary: 'session start in a code repo'
    action: "Read the Map and Libraries sections of this repo's AGENTS.md first, then search narrowly. {knowledge_index}"
    strength: nudge   # {knowledge_index}: one status line (Map, Libraries, opt-in tools), never file content

  - id: no-ai-base
    scope: global
    summary: 'session start: repo without .ai/base-version'
    trigger: {state: 'git repo without .ai/base-version'}
    when: session_start
    action: "No AI base or Map here. Suggest the owner runs ai-adopt."
    proof: 'ai-adopt'
    strength: nudge

  - id: knowledge-check
    scope: global
    trigger: {tool_after: 'Bash', command: '\bgit commit\b'}
    summary: 'after a git commit'
    action: "{knowledge_delta}"   # full phrase from HEAD: update the Map, ai-libs --sync (graph: the router refreshes it); empty = silent
    once_per: 'session'
    proof: 'AGENTS.md|ai-libs|graphify update'
    strength: nudge

  # ---------- gates ----------
  - id: audit-before-install
    scope: global
    summary: 'before a package install command'
    trigger: {tool_before: 'Bash', command: '\b(npm (i|install|add)|pnpm add|yarn add|bun add|pip3? install|uv (add|pip install|tool install)|pipx install|cargo (add|install)|brew install|gem install|go install)\b|npx [^ ]+@latest|curl [^|]*\|\s*(ba)?sh'}
    action: "agent-audit this package first. No @latest, no curl-to-shell."
    strength: gate    # passes only when agent-audit logged this package in the last 24 h

  - id: secret-scan
    scope: global
    summary: 'before git commit or push'
    trigger: {tool_before: 'Bash', command: '\bgit (commit|push)\b'}
    action: "Secret scan found a key, token or password. Remove it before commit or push."
    strength: gate    # gate fires only on a hit

  - id: no-sudo
    scope: global
    trigger: {tool_before: 'Bash|shell|exec_command|local_shell', command: '\b(sudo|doas|pkexec|sudoedit|su|run0)\b'}
    summary: 'any sudo, su, doas, pkexec'
    action: "No sudo for agents: give the owner the exact command. Box work on a server: the box tool (MCP server box); outside a sandbox also plain proj-agent <subcommand>; never sudo."
    strength: gate    # blocks at a command position (also inside bash -c, behind env/nice/timeout); quoted text never counts

  - id: pr-rules
    scope: global
    summary: 'before gh pr create or edit'
    trigger: {tool_before: 'Bash', command: '\bgh pr (create|edit)\b'}
    action: "PR body: summary, Mermaid diagram, one-way or two-way door, blast radius, author-sessions block at the end."
    strength: gate    # blocks when the body has no ```mermaid block or no <!-- author-sessions block

  # ---------- lint and docs ----------
  - id: no-em-dash
    scope: global
    summary: 'after a write with U+2014'
    trigger: {tool_after: 'Edit|Write', content: "\u2014"}   # escaped so this file itself passes the lint
    action: "Remove the em dash (U+2014). Use '-', ':' or a new sentence."
    strength: nudge

  - id: docs-lookup
    scope: global
    summary: 'docs, SDK or library prompt'
    trigger: {prompt: '\b(docs|documentation|api reference|sdk|library|framework|how (do|to) (i )?use|migrat(e|ion) to|upgrade to)\b', prompt_libs: true}
    action: "Library code: context7 query-docs with the ID from the Libraries section (resolve only if missing), then the official docs site. {libs_hits}"
    proof: 'tool:mcp__\S*context7'
    strength: nudge

  # ---------- opt-in tool is off here: suggest it, never install it ----------
  - id: seo-not-enabled
    scope: global
    summary: 'SEO prompt, project without claude-seo'
    trigger: {prompt: '\b(seo|serp|rank(ing|s)?|meta (title|description)|schema markup|structured data|sitemap|core web vitals|cwv|hreflang|backlinks?|ai overviews?|geo audit|search console)\b', state: 'project without claude-seo'}
    action: "claude-seo is off in this project. Suggest: ai-adopt --tools seo. Do not enable it yourself."
    proof: 'ai-adopt'
    strength: nudge

  - id: blog-not-enabled
    scope: global
    summary: 'blog prompt, project without claude-blog'
    trigger: {prompt: '\b(blog|blog post|article|write a post|rewrite (the|this) post|newsletter)\b', state: 'project without claude-blog'}
    action: "claude-blog is off in this project. Suggest: ai-adopt --tools blog. Do not enable it yourself."
    proof: 'ai-adopt'
    strength: nudge

  - id: browser-not-enabled
    scope: global
    summary: 'browser prompt, project without Playwright MCP'
    trigger: {prompt: '\b(screenshot|open the page|click|e2e|end to end|browser test|playwright)\b', state: 'project without Playwright MCP'}
    action: "No Playwright MCP in this project. Suggest: ai-adopt --tools browser. Do not install a browser tool yourself."
    proof: 'ai-start'
    strength: nudge

  # ---------- opt-in per project (catalog for ai-adopt --tools) ----------
  # serena and graph are ON BY DEFAULT (owner 2026-11-12 evening): they fire in every code repo unless
  # .ai/enabled has no-serena / no-graph. scope stays opt-in so the router can switch them off per project.
  - id: serena
    scope: opt-in
    tool: Serena
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, Serena on (default)'
    action: "Serena is on here (no memories, the Map is the knowledge place): get_symbols_overview / find_symbol for definitions, find_referencing_symbols for users, replace_symbol_body for edits."
    strength: nudge

  - id: graph
    scope: opt-in
    tool: graphify
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, graphify on (default)'
    action: "graphify is on here: graphify query for structure before rg; the graph refreshes itself after commits, merges and checkouts."
    strength: nudge

  - id: omc
    scope: opt-in
    tool: oh-my-claudecode
    when: session_start
    trigger: {state: 'git repo with code'}
    summary: 'session start, oh-my-claudecode on here'
    action: "oh-my-claudecode is on here: its skills and agents are available (/oh-my-claudecode:...). It writes .omc/ in this repo (keep it out of commits except .omc/skills/)."
    strength: nudge

  - id: seo
    scope: opt-in
    summary: 'SEO prompt'
    tool: claude-seo
    trigger: {prompt: '\b(seo|serp|rank(ing|s)?|meta (title|description)|schema markup|structured data|sitemap|core web vitals|cwv|hreflang|backlinks?|ai overviews?|geo audit|search console)\b'}
    action: "SEO task: claude-seo first (/seo audit <url>, /seo page <url>). {claude_handoff}"
    proof: 'skill:\S*seo|claude -p|claude-seo/skills'
    strength: nudge

  - id: blog
    scope: opt-in
    summary: 'blog prompt'
    tool: claude-blog
    trigger: {prompt: '\b(blog|blog post|article|write a post|rewrite (the|this) post|newsletter)\b'}
    action: "Blog task: claude-blog first (claude-blog:blog routes). Post file: blog-*. Site: seo-*. {claude_handoff}"
    proof: 'skill:\S*blog|claude -p|claude-blog/skills'
    strength: nudge

  - id: browser
    scope: opt-in
    summary: 'browser prompt (screenshot, click, e2e)'
    tool: Playwright MCP
    trigger: {prompt: '\b(screenshot|open the page|click|e2e|end to end|browser test|playwright)\b'}
    action: "Browser work: Playwright MCP (headless, isolated on servers)."
    proof: 'tool:mcp__\S*playwright'
    strength: nudge

  - id: ui
    scope: opt-in
    summary: 'UI prompt or UI file'
    tool: ui-ux-pro-max
    trigger: {prompt: '\b(ui|ux|design|landing page|component|layout|color palette|typography|dark mode)\b', paths: '**/*.{tsx,jsx,vue,svelte,css,scss}'}
    action: "UI work: use ui-ux-pro-max. Ask before paid image generation or any npx ...@latest."
    proof: 'skill:\S*ui-ux-pro-max'
    strength: nudge

  - id: tracker-flow
    scope: opt-in
    summary: 'tickets, spec, triage, backlog prompt'
    tool: mattpocock tracker skills
    trigger: {prompt: '\b(ticket|tickets|spec|triage|backlog|roadmap|wayfinder)\b'}
    action: "to-spec / to-tickets / triage / wayfinder. They write to the tracker: confirm the repo first."
    proof: 'skill:\S*(to-spec|to-tickets|triage|wayfinder)'
    strength: nudge

  - id: domain-docs
    scope: opt-in
    summary: 'glossary, domain model, ADR prompt'
    tool: mattpocock grill-with-docs + domain-modeling
    trigger: {prompt: '\b(glossary|domain model|ubiquitous language|adr|decision record)\b'}
    action: "Use grill-with-docs / domain-modeling (GLOSSARY.md, docs/adr/)."
    proof: 'skill:\S*(grill-with-docs|domain-model)'
    strength: nudge

  - id: knowledge-wiki
    scope: opt-in
    summary: 'wiki or knowledge base prompt'
    tool: llm-wiki-compiler
    trigger: {prompt: '\b(wiki|knowledge base|research notes|compile (the )?docs)\b'}
    action: "Use llm-wiki-compiler (costs LLM tokens per compile)."
    proof: 'wiki'
    strength: nudge

# ---------- tie-breaks (single source for L0, L2, L3) ----------
# trigger -> winner; losers named so the router never suggests both.
tiebreaks:
  - {trigger: 'one post file, or a post to be written', winner: 'claude-blog:blog-*', loser: 'claude-seo:seo-*', match: '\b(this|the|a|one|new|my|next) (blog )?post\b|\bpost file\b|\b(write|draft|rewrite) (a |the |this )?(blog )?post\b'}
  - {trigger: 'URL, domain, whole site', winner: 'claude-seo:seo-*', loser: 'claude-blog:blog-*', match: 'https?://|\bwww\.|\b(whole|entire|full) (site|website)\b|\bdomain\b'}
  - {trigger: 'new app or project (kickoff)', winner: 'grilling (typed: /grill-me)', loser: 'OMC deep-interview (fallback)', match: '\bnew (app|project)\b|\bkick ?off\b'}
  - {trigger: 'deep interview, ambiguity score', winner: 'OMC deep-interview', loser: 'matt grilling', match: '\bdeep interview\b|\bambiguity score\b'}
  - {trigger: 'library API docs', winner: 'context7 with the Libraries ID', loser: 'web search', match: '\b(api docs|library docs|docs for)\b'}
