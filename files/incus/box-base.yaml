description: proj box base (managed by ~/.dotfiles step 70-hosting)
config:
  # Each box gets its own UID range on the host: root in box A is nobody in box B.
  # Not a live option: it applies when a box is launched (proj new, recreate, fork).
  security.idmap.isolated: "true"
  security.privileged: "false"
  # Ubuntu 26.04 boxes need nesting: without it systemd-networkd never configures eth0 (tested
  # 2026-11-11 on Incus 6.0.5: 26.04 no IP without it, IP with it; 24.04 works either way).
  # Safe here: the box stays unprivileged with its own isolated UID range.
  security.nesting: "true"
  limits.processes: "4000"
devices:
  root:
    type: disk
    path: /
    pool: boxes
    size: 10GiB
  eth0:
    type: nic
    name: eth0
    network: incusbr0
    # Boxes cannot talk to each other. Works only when EVERY box NIC has it, so it lives here.
    security.port_isolation: "true"
    # The egress ACL on the NIC too, with explicit default actions (the NIC overrides the network).
    security.acls: box-egress
    security.acls.default.egress.action: allow
    security.acls.default.ingress.action: allow
